name: Acquire Unity Activation File (.alf)

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Activation File (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2021.1.11f1

      - name: Upload .alf artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: "**/*.alf"
