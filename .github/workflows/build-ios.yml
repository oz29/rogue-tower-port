name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build Unity & Package IPA
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity iOS Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          unityVersion: 2021.1.11f1
          buildsPath: build

      - name: Build Xcode Archive & IPA
        run: |
          cd build/iOS
          xcodebuild build -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -destination 'generic/platform=iOS' -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r RogueTower.ipa Payload
          mv RogueTower.ipa ../../

      - name: Upload RogueTower.ipa
        uses: actions/upload-artifact@v4
        with:
          name: RogueTower-iOS-IPA
          path: RogueTower.ipa
