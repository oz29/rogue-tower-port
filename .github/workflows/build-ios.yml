name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  buildUnity:
    name: 1. Build Unity to Xcode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity iOS Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          unityVersion: 2021.1.11f1
          buildsPath: build

      - name: Upload Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: XcodeProject
          path: build/iOS

  packageIPA:
    name: 2. Package IPA with Xcode
    needs: buildUnity
    runs-on: macos-14
    steps:
      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: XcodeProject
          path: build/iOS

      - name: Build Xcode Archive & IPA
        run: |
          cd build/iOS
          # Build app without code signing
          xcodebuild build -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -destination 'generic/platform=iOS' -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
          # Package into .ipa
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r RogueTower.ipa Payload
          mv RogueTower.ipa ../../

      - name: Upload RogueTower.ipa
        uses: actions/upload-artifact@v4
        with:
          name: RogueTower-iOS-IPA
          path: RogueTower.ipa
